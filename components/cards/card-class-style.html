<!-- Component: Class Style Card — Jivamukti Yoga München
     Usage: stunden-stile page. Describes a class style (Vinyasa, Yin, Kundalini, etc.)
     Repeat inside u-grid-autofit. -->
<article class="class-style_card u-position-relative" data-trigger="hover focus">
    <div class="class-style_card_media image-wrap image-wrap--landscape image-wrap--rounded">
        <img src="assets/class-style-placeholder.webp" alt="Vinyasa Flow Klasse bei Jivamukti München" class="image-wrap__img image-wrap__img--cover">
    </div>

    <div class="class-style_card_body u-padding-4">
        <h3 class="c-heading class-style_card_title" data-style="h3">Vinyasa</h3>
        <p class="class-style_card_lede u-text-style-main">
            Dynamischer Flow im Atemrhythmus. Kraft, Ausdauer und Fokus — eine belebende Praxis für Körper und Geist.
        </p>
        <ul role="list" class="class-style_card_meta u-flex-horizontal-wrap u-gap-inline-3 u-text-style-small u-margin-top-3 w-list-unstyled">
            <li><span class="u-letter-spacing-wider u-text-transform-uppercase">Level</span>: 1–3</li>
            <li><span class="u-letter-spacing-wider u-text-transform-uppercase">Dauer</span>: 75 Min.</li>
            <li><span class="u-letter-spacing-wider u-text-transform-uppercase">Studios</span>: Lehel · Glockenbach</li>
        </ul>
    </div>

    <div class="clickable_wrap u-cover-absolute">
        <a href="stunden-stile/vinyasa.html" class="clickable_link w-inline-block">
            <span class="clickable_text u-sr-only">Mehr über Vinyasa</span>
        </a>
    </div>
</article>
