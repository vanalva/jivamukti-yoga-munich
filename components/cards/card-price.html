<!-- Component: Price Card — Jivamukti Yoga München
     Usage: preise page. One card per pricing tier.
     Variants: base, is-featured (highlighted tier). Combo is-featured goes after base. -->
<article class="price_card">
    <header class="price_card_header">
        <p class="price_card_eyebrow u-text-style-small u-letter-spacing-wider u-text-transform-uppercase">Empfehlung</p>
        <h3 class="c-heading price_card_name" data-style="h3">Monatskarte</h3>
        <p class="price_card_subtitle u-text-style-small">Gültig in beiden Studios</p>
    </header>

    <div class="price_card_pricing">
        <span class="price_card_amount">€99</span>
        <span class="price_card_period u-text-style-small">/ Monat</span>
    </div>
    <p class="price_card_note u-text-style-small">€85 ermäßigt · €75 unter 23</p>

    <ul role="list" class="price_card_features w-list-unstyled">
        <li class="price_card_feature u-text-style-main">Unbegrenzte Klassen</li>
        <li class="price_card_feature u-text-style-main">Beide Studios (Lehel + Glockenbach)</li>
        <li class="price_card_feature u-text-style-main">Alle Klassen-Stile inbegriffen</li>
        <li class="price_card_feature u-text-style-main">Monatlich kündbar</li>
    </ul>

    <div class="price_card_cta">
        <div data-wf--button-main--variant="primary" class="button_main_wrap" data-button=" " data-trigger="hover focus">
            <div class="clickable_wrap u-cover-absolute"><a href="#" class="clickable_link w-inline-block" aria-label="Monatskarte kaufen"></a></div>
            <div class="button_main_element"><div class="button_main_text u-text-style-main">Hier kaufen</div></div>
        </div>
    </div>
</article>
