<!-- Component: Studio Card — Jivamukti Yoga München
     Usage: unsere-studios page. One card per studio (Lehel + Glockenbach).
     Repeat inside u-grid-autofit or u-grid-custom (u-column-6 each). -->
<article class="studio_card">
    <div class="studio_card_media image-wrap image-wrap--landscape-photo image-wrap--rounded">
        <img src="assets/studio-lehel.webp" alt="Studio Lehel — Jivamukti Yoga München" class="image-wrap__img image-wrap__img--cover">
    </div>

    <div class="studio_card_body u-padding-5">
        <p class="studio_card_eyebrow u-text-style-small u-letter-spacing-wider u-text-transform-uppercase">Yogaschule</p>
        <h3 class="c-heading studio_card_name" data-style="h3">Lehel</h3>
        <address class="studio_card_address u-text-style-main">
            Robert-Koch-Str. 13<br>
            80538 München
        </address>
        <p class="studio_card_desc u-text-style-main">
            Ruhig gelegen, nahe Isar und Friedensengel. Ein Ort für Stille, Kraft und Verbindung.
        </p>

        <div class="u-button-group u-margin-top-4">
            <div data-wf--button-main--variant="primary" class="button_main_wrap" data-button=" " data-trigger="hover focus">
                <div class="clickable_wrap u-cover-absolute"><a href="stundenplan-lehel.html" class="clickable_link w-inline-block" aria-label="Stundenplan Lehel"></a></div>
                <div class="button_main_element"><div class="button_main_text u-text-style-main">Stundenplan ansehen</div></div>
            </div>
            <div data-wf--button-main--variant="secondary" class="button_main_wrap" data-button=" " data-trigger="hover focus">
                <div class="clickable_wrap u-cover-absolute"><a href="https://maps.google.com/?q=Robert-Koch-Str.+13+München" target="_blank" rel="noopener" class="clickable_link w-inline-block" aria-label="Route zum Studio Lehel"></a></div>
                <div class="button_main_element"><div class="button_main_text u-text-style-main">Route anzeigen</div></div>
            </div>
        </div>
    </div>
</article>
