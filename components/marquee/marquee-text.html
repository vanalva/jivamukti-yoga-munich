<!-- Component: Text Marquee — Jivamukti Yoga München
     Usage: Homepage, between sections. Infinite loop of brand words/values.
     Dependencies: Swiper 8 (freeMode). Uses marquee-text.js for init. -->
<section class="marquee_text u-theme-brand u-padding-block-4 u-overflow-hidden">
    <div class="marquee_text_track swiper"
         data-marquee-speed="40"
         data-marquee-direction="left"
         data-marquee-hover="reverse">
        <div class="swiper-wrapper">
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Asana</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Bhakti</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Pranayama</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Meditation</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Ahimsa</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_item c-heading" data-style="h2">Community</span></div>
            <div class="swiper-slide marquee_text_slide"><span class="marquee_text_bullet" aria-hidden="true">✦</span></div>
        </div>
    </div>
</section>
