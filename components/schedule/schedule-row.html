<!-- Component: Schedule Row — Jivamukti Yoga München
     Usage: stundenplan-lehel / stundenplan-glockenbach. One row = one class.
     Repeat inside a .schedule_day wrapper. -->
<article class="schedule_row u-flex-horizontal-wrap u-align-items-center u-gap-inline-4 u-padding-block-3">
    <div class="schedule_row_time">
        <time datetime="07:30" class="schedule_row_start c-heading" data-style="h5">07:30</time>
        <span class="schedule_row_duration u-text-style-small">75 Min.</span>
    </div>

    <div class="schedule_row_class u-flex-grow">
        <h3 class="c-heading schedule_row_title" data-style="h5">Morning Vinyasa</h3>
        <p class="schedule_row_meta u-text-style-small">
            <span class="schedule_row_style u-letter-spacing-wider u-text-transform-uppercase">Vinyasa</span>
            <span aria-hidden="true">·</span>
            <span class="schedule_row_teacher">mit Jessina</span>
            <span aria-hidden="true">·</span>
            <span class="schedule_row_level">Level 1–2</span>
        </p>
    </div>

    <div class="schedule_row_cta">
        <div data-wf--button-main--variant="secondary" class="button_main_wrap" data-button=" " data-trigger="hover focus">
            <div class="clickable_wrap u-cover-absolute"><a href="#" class="clickable_link w-inline-block" aria-label="Morning Vinyasa am 07:30 buchen"></a></div>
            <div class="button_main_element"><div class="button_main_text u-text-style-small">Buchen</div></div>
        </div>
    </div>
</article>
